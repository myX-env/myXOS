@HELP_START@
検索/クイックリンクメニュー

現在適用される設定（Button=行のみ有効）
Button=検＊|^f|#x

記述形式
Button=表示名|キー1|キー2

各項目の意味
表示名 ： ボタンに表示する文字
|      ： 区切り文字（半角の縦棒）
^      ： Ctrlキー
#      ： Windowsキー

例
^f  = Ctrl + F
#x  = Windows + X

※ Ctrlキーは小文字で記述する
　例：^f、^c、^v

設定ファイル
settings.ini（UTF-8形式）
@HELP_END@
